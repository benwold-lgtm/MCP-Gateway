name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger. Lets a run be started without pushing a commit — needed when
  # webhook delivery is degraded and pushes stop scheduling runs on their own.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis available at localhost:6379 for real-Redis integration tests
    # (the unit suite uses fakeredis; this lets integration tests opt in via
    # MCP_REDIS_URL without changing the harness).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      MCP_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 device_mcp_gateway/ tests/ --max-line-length=120

      - name: Type check (mypy)
        run: mypy device_mcp_gateway/ --ignore-missing-imports

      # Ratchet: measured 83% at the time of writing, floor set to actual-minus-2 so a
      # PR that quietly drops coverage fails instead of coasting under a stale 65.
      # Raise this when actual rises — never lower it to make a red build green.
      - name: Run tests (with coverage gate)
        run: pytest tests/ -v --cov=device_mcp_gateway --cov-report=term-missing --cov-fail-under=81

      - name: Build Docker image
        run: docker build -t device-mcp-gateway:ci .

  catalog:
    runs-on: ubuntu-latest

    # ADR-0020: the catalog service is a separate component (own package, own database)
    # bundled in this repo — see device_mcp_catalog/README.md. Its own job, its own
    # Postgres service container, so a change here can't silently break (or be masked by)
    # the gateway's own `test` job above.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catalog_test
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:test@localhost:55432/catalog_test

    defaults:
      run:
        working-directory: device_mcp_catalog

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: device_mcp_catalog/requirements.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 device_mcp_catalog/ tests/ --max-line-length=120

      - name: Type check (mypy)
        run: mypy device_mcp_catalog/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v

      - name: Install security scanners
        run: pip install bandit

      - name: Static security scan (bandit)
        run: bandit -r device_mcp_catalog -ll

      # The tests above install from pyproject.toml; the IMAGE installs from
      # requirements.txt (see Dockerfile). Nothing compared the two, so a dependency
      # added to one and not the other passed every test here and produced an image
      # that failed on import at runtime. This is the check that names that cause.
      #
      # ⚠️ THIS OVERLAPS "The image actually runs" BELOW, DELIBERATELY. Do not remove it
      # as redundant. That step catches strictly more — a broken entrypoint, a file the
      # Dockerfile forgot — and it is the backstop precisely because it cannot be fooled by
      # drift logic being subtly wrong, which this repo has already shipped once. But it
      # fails as a container that will not start, which is a mystery to diagnose. This step
      # fails as "your requirements.txt is missing a pin", at the point of the mistake, and
      # the ordinary mistake is far more common than the rare one the backstop exists for.
      # The overlap is the design: one check for the class, one for the error message.
      - name: requirements.txt agrees with pyproject.toml
        run: |
          pip install pip-tools
          cp requirements.txt /tmp/requirements.before
          pip-compile --quiet --output-file=requirements.txt pyproject.toml
          # Compare the PINS, not the whole file. pip-compile writes its own invocation into
          # the file header, and that line changes with the pip-tools version — 7.6.1 on the
          # runner adds `--no-index`, which a local run does not. Diffing the whole file
          # therefore fails on a tool upgrade while every pin is identical, and a check that
          # cries wolf on an unrelated upgrade is one somebody eventually deletes. The `# via`
          # provenance comments are dropped for the same reason: informative, not load-bearing.
          if ! diff -u <(grep -v '^[[:space:]]*#' /tmp/requirements.before) \
                       <(grep -v '^[[:space:]]*#' requirements.txt); then
            echo "::error::requirements.txt is out of date with pyproject.toml. The image"
            echo "::error::installs from requirements.txt, so this drift ships a container"
            echo "::error::that builds cleanly and fails on import. Re-run:"
            echo "::error::  cd device_mcp_catalog && pip-compile --output-file=requirements.txt pyproject.toml"
            exit 1
          fi
          # Leave the tree as it was found: later steps build the image from this file, and
          # they must build what the commit actually contains, not what pip-compile just
          # regenerated. Otherwise the smoke test would validate a requirements.txt nobody
          # committed — a check quietly testing something other than the artifact.
          cp /tmp/requirements.before requirements.txt

      - name: Build Docker image
        run: docker build -t device-mcp-catalog:ci .

      # Building an image proves it compiles, not that it runs. Every failure the check
      # above catches is a subset of what this one catches — a missing dependency, a
      # broken entrypoint, a file the Dockerfile forgot to COPY — and this one cannot be
      # fooled by getting the drift logic subtly wrong, which has happened in this repo
      # before. /healthz is liveness only and needs no database, so this asserts the
      # process starts and serves, nothing more.
      - name: The image actually runs
        run: |
          docker run -d --name catalog-smoke -e CATALOG_API_TOKEN=smoke device-mcp-catalog:ci
          # Probed from INSIDE the container, not over a published port. Host port
          # publishing is the runner's business and can fail for reasons that have nothing
          # to do with the image — which would make this check flaky in exactly the
          # direction that gets checks deleted. `python` is guaranteed present here; curl
          # is not, on a slim base.
          probe() {
            docker exec catalog-smoke python -c "
          import sys, urllib.request
          try:
              body = urllib.request.urlopen('http://127.0.0.1:$1$2', timeout=3).read().decode()
          except Exception as exc:
              print(exc); sys.exit(1)
          sys.exit(0 if '$3' in body else 1)
          "
          }
          for i in $(seq 1 30); do
            if probe 8100 /healthz '"status":"ok"'; then
              echo "catalog answered /healthz"
              # And the series the MCPCatalogMetricsAbsent alert watches for actually
              # exists in the built image. That alert is the backstop for every other rule
              # in monitoring.yaml; a typo'd or unregistered metric would silence the lot
              # while every YAML file still looked correct.
              if ! probe 9100 /metrics catalog_info; then
                echo "::error::The image serves /healthz but exposes no catalog_info on :9100."
                echo "::error::MCPCatalogMetricsAbsent watches for that series, so without it"
                echo "::error::every catalog alert is silent and looks healthy (ADR-0020 §7b)."
                docker logs catalog-smoke
                docker rm -f catalog-smoke >/dev/null
                exit 1
              fi
              echo "catalog exposed catalog_info on :9100"
              docker rm -f catalog-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::The image built but never served /healthz. Container logs:"
          docker logs catalog-smoke
          docker rm -f catalog-smoke >/dev/null
          exit 1

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install pip-audit bandit

      # Advisory: new upstream CVEs shouldn't block unrelated PRs. A red step here is a
      # prompt to look, not a broken build — docs/dependency-advisories.md explains how to
      # decide whether a finding is reachable, and carries the standing triage so the same
      # advisory isn't investigated twice.
      - name: Dependency vulnerability scan (pip-audit, advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      # Blocking: bandit scans our own code, which we keep clean (intentional
      # cases suppressed inline with justified # nosec).
      - name: Static security scan (bandit)
        run: bandit -r device_mcp_gateway -ll

  # `tests/test_k8s_manifests.py` already checks that every manifest is valid YAML with a
  # `kind`, plus some targeted structure (HPA targets, scrape annotations). What it cannot
  # check is whether kustomize can BUILD the bundle: valid YAML in a file that kustomize
  # never reads passes every one of those assertions. So a broken `resources:` list — a
  # missing path, a moved file, a bad patch target — was invisible to the whole suite, and
  # surfaced on the operator's machine at `kubectl apply -k`, which is the worst place for
  # it. That gap is what this job covers; it does not replace those tests.
  manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Both bundles must build. They are applied separately and on different cadences —
      # the tenant stack once per tenant, the catalog once per estate — so a break in one
      # says nothing about the other.
      - name: Tenant stack builds
        run: kubectl kustomize deploy/kubernetes/ > /tmp/tenant.yaml

      - name: Catalog builds
        run: kubectl kustomize deploy/kubernetes/catalog/ > /tmp/catalog.yaml

      # The separation itself, asserted rather than assumed. Re-adding the catalog to the
      # tenant kustomization for one-command-demo convenience is the exact regression this
      # split exists to prevent (ADR-0020 §1: no tenant reach), and it would otherwise be a
      # three-line change nobody notices — the stack would come up fine, once per tenant.
      - name: The tenant stack carries no provider-plane storage
        run: |
          if grep -qE 'device-mcp-catalog|catalog-postgres' /tmp/tenant.yaml; then
            echo "::error::The catalog is back in the tenant stack. It is a provider-plane"
            echo "::error::object with no tenant reach (ADR-0020 §1), and this bundle is"
            echo "::error::deployed once PER TENANT — so bundling gives every tenant its own"
            echo "::error::copy of a store that belongs to no tenant. Apply it separately:"
            echo "::error::  kubectl apply -k deploy/kubernetes/catalog/"
            exit 1
          fi

      - name: The catalog carries no tenant-plane markings
        run: |
          if grep -qE 'mcp\.gateway/tenant|plane: tenant' /tmp/catalog.yaml; then
            echo "::error::The catalog namespace is labelled as a tenant. It belongs to no"
            echo "::error::tenant, and a per-tenant policy must not be able to select it."
            exit 1
          fi

      # ADR-0020 §7b. A ServiceMonitor pointing at a port the NetworkPolicy does not admit
      # discovers its target and never scrapes it — and every alert on that target then
      # stays silent, which for a should-never-happen alert is indistinguishable from a
      # healthy estate. The runtime backstop is MCPCatalogMetricsAbsent; this is the
      # cheaper, earlier one, and it names the specific port rather than the symptom.
      - name: Every scraped port is admitted by a NetworkPolicy
        run: |
          python3 - <<'EOF'
          import sys, yaml, pathlib

          mon = list(yaml.safe_load_all(pathlib.Path("deploy/kubernetes/catalog/monitoring.yaml").read_text()))
          npol = list(yaml.safe_load_all(pathlib.Path("deploy/kubernetes/catalog/networkpolicy.yaml").read_text()))
          svc = list(yaml.safe_load_all(pathlib.Path("deploy/kubernetes/catalog/service.yaml").read_text()))

          # ServiceMonitor endpoints name a Service PORT NAME; NetworkPolicy rules name a
          # number. The Service is what maps between them, so all three files have to agree
          # and the check has to read all three.
          port_numbers = {
              p["name"]: p.get("targetPort", p["port"])
              for d in svc if d and d.get("kind") == "Service"
              for p in d["spec"]["ports"]
          }
          scraped = {
              ep["port"]
              for d in mon if d and d.get("kind") == "ServiceMonitor"
              for ep in d["spec"]["endpoints"]
          }
          allowed = {
              port.get("port")
              for d in npol if d and d.get("kind") == "NetworkPolicy"
              for rule in (d["spec"].get("ingress") or [])
              for port in (rule.get("ports") or [])
          }

          failed = False
          for name in sorted(scraped):
              if name not in port_numbers:
                  print(f"::error::ServiceMonitor scrapes port '{name}', which the Service does not define.")
                  failed = True
              elif port_numbers[name] not in allowed:
                  print(f"::error::ServiceMonitor scrapes port '{name}' (:{port_numbers[name]}), which no")
                  print("::error::NetworkPolicy admits. The namespace default-deny will drop every scrape,")
                  print("::error::silently, and every alert on that target will stay quiet while looking")
                  print("::error::healthy. Add an ingress rule for it in networkpolicy.yaml.")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
