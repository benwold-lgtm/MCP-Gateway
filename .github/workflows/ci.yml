name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual trigger. Lets a run be started without pushing a commit — needed when
  # webhook delivery is degraded and pushes stop scheduling runs on their own.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis available at localhost:6379 for real-Redis integration tests
    # (the unit suite uses fakeredis; this lets integration tests opt in via
    # MCP_REDIS_URL without changing the harness).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      MCP_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 device_mcp_gateway/ tests/ --max-line-length=120

      - name: Type check (mypy)
        run: mypy device_mcp_gateway/ --ignore-missing-imports

      # Ratchet: measured 83% at the time of writing, floor set to actual-minus-2 so a
      # PR that quietly drops coverage fails instead of coasting under a stale 65.
      # Raise this when actual rises — never lower it to make a red build green.
      - name: Run tests (with coverage gate)
        run: pytest tests/ -v --cov=device_mcp_gateway --cov-report=term-missing --cov-fail-under=81

      - name: Build Docker image
        run: docker build -t device-mcp-gateway:ci .

  catalog:
    runs-on: ubuntu-latest

    # ADR-0020: the catalog service is a separate component (own package, own database)
    # bundled in this repo — see device_mcp_catalog/README.md. Its own job, its own
    # Postgres service container, so a change here can't silently break (or be masked by)
    # the gateway's own `test` job above.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catalog_test
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:test@localhost:55432/catalog_test

    defaults:
      run:
        working-directory: device_mcp_catalog

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: device_mcp_catalog/requirements.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 device_mcp_catalog/ tests/ --max-line-length=120

      - name: Type check (mypy)
        run: mypy device_mcp_catalog/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v

      - name: Install security scanners
        run: pip install bandit

      - name: Static security scan (bandit)
        run: bandit -r device_mcp_catalog -ll

      - name: Build Docker image
        run: docker build -t device-mcp-catalog:ci .

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install pip-audit bandit

      # Advisory: new upstream CVEs shouldn't block unrelated PRs. A red step here is a
      # prompt to look, not a broken build — docs/dependency-advisories.md explains how to
      # decide whether a finding is reachable, and carries the standing triage so the same
      # advisory isn't investigated twice.
      - name: Dependency vulnerability scan (pip-audit, advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      # Blocking: bandit scans our own code, which we keep clean (intentional
      # cases suppressed inline with justified # nosec).
      - name: Static security scan (bandit)
        run: bandit -r device_mcp_gateway -ll
