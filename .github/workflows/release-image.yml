name: Release image

# Publishes the multi-arch gateway image so a low-power host (Raspberry Pi, mini-PC,
# old workstation — arm64 or amd64) can `docker pull` it instead of building locally.
# Runs on a version tag (v*), or on demand. Per-PR Dockerfile breakage is already
# caught by the amd64 `docker build` step in ci.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_catalog:
        description: >-
          Publish the provider-plane catalog image too. Default false: the provider tier is
          FROZEN (2026-09-01) and its image is deliberately not downloadable. See the
          catalog-image job below before setting this to true.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/device-mcp-gateway
          # `lite` is the moving tag SyncGate Lite still pins (its own repo). Slated for
          # retirement once that repo moves to a semver pin — a moving tag has the same
          # problem as `:latest`. Until then removing it here breaks Lite's next pull.
          # semver + latest
          # serve versioned/enterprise pulls. latest=auto tags a non-prerelease release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=lite
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # The catalog is a SECOND image. ci.yml already BUILDS it per PR (its `catalog` job runs
  # `docker build` under working-directory: device_mcp_catalog), so Dockerfile breakage was
  # always caught — what nothing did was PUBLISH it, while
  # deploy/kubernetes/catalog/deployment.yaml pinned
  # ghcr.io/<owner>/device-mcp-catalog:latest. Applying the shipped catalog kustomization
  # therefore gave ImagePullBackOff on a tag that had never been published. It went
  # unnoticed because the catalog used to be bundled into the gateway's kustomization, so
  # nobody deployed it on its own and nothing ever tried to pull it (ADR-0020 §7 makes it a
  # separate component; the deployment finally matches).
  # ── FROZEN 2026-09-01 ──────────────────────────────────────────────────────────────
  # The provider tier is frozen: lite and single-tenant are the supported editions, and the
  # foundation gets finished before multi-tenancy is layered back on. The catalog is the
  # provider plane's only shipped component, so freezing the tier means this image is not
  # downloadable — a version tag no longer publishes it.
  #
  # **Frozen, not deleted, and deliberately so.** The code stays, `ci.yml`'s `catalog` job
  # still builds and tests it on every PR, and the manifests in deploy/kubernetes/catalog/
  # are untouched. What changes is only whether a tag pushes the image to a public registry.
  # Nothing here needs rewriting to unfreeze — run this workflow by hand with
  # `publish_catalog: true`, or delete the `if:` below.
  #
  # Left runnable on purpose rather than commented out: a job that cannot run is a job that
  # silently rots, and the whole point of freezing rather than deleting is being able to
  # come back to it.
  catalog-image:
    if: ${{ inputs.publish_catalog }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/device-mcp-catalog
          # No `lite` tag: SyncGate Lite is a single-tenant stack with no provider
          # plane, and the catalog is a provider-plane object with no tenant reach
          # (ADR-0020 §1). Shipping it to that profile would invite exactly the bundling
          # this component was split out of.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=auto

      # ⚠️ context is device_mcp_catalog/, NOT the repo root. The catalog is a separate
      # distribution with its own pyproject.toml — that is where the `device-mcp-catalog`
      # console script and `packages.find include = ["device_mcp_catalog*"]` live. Built
      # from the root, `COPY pyproject.toml ./` picks up the gateway's, which declares
      # neither, and the image builds CLEANLY then dies at startup with
      # `exec: "device-mcp-catalog": executable file not found in $PATH`.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: device_mcp_catalog
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
