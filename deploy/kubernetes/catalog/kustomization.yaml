apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── The provider-plane device catalog (ADR-0020) ───────────────────────────────────
#
# Applied SEPARATELY from the gateway stack, and exactly once per estate:
#
#   kubectl apply -k deploy/kubernetes/catalog/
#
# **Why it is not in the gateway's kustomization any more.** It used to be, described there
# as "deployment convenience". Under one-stack-per-tenant that convenience becomes a
# correctness problem: every tenant got its own copy of a store that belongs to no tenant,
# so "which device types exist" had as many answers as there were tenants, and a tenant
# deployment had to actively DELETE six objects to be correct. ADR-0020 §1 makes the catalog
# a provider-plane object with no tenant reach and §7 makes it its own component with its own
# failure domain; bundling it into the thing it is supposed to be independent of contradicted
# both. Where it physically lives stays a deployment choice (§7) — what is fixed is that
# choosing is now possible.
#
# ⚠️ There is ONE of these per estate, not one per tenant. It is not part of the per-tenant
# overlay, and nothing here should ever be parameterised by tenant.

namespace: mcp-provider

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml

# ── Before applying: the Secret ────────────────────────────────────────────────────
# `catalog-secrets` is NOT created here (a Secret in git is a credential in git). Both the
# catalog and its Postgres mount it, so without it both pods sit in CreateContainerConfigError
# — which reads as a broken image rather than a missing prerequisite.
#
#   PG_PW=$(openssl rand -hex 24)
#   kubectl create namespace mcp-provider
#   kubectl create secret generic catalog-secrets \
#     --namespace=mcp-provider \
#     --from-literal=postgres-password="$PG_PW" \
#     --from-literal=database-url="postgresql://catalog:$PG_PW@catalog-postgres:5432/catalog" \
#     --from-literal=api-token=$(openssl rand -hex 32)
#
# ⚠️ The user is `catalog`, NOT `postgres`. postgres.yaml sets POSTGRES_USER=catalog, so the
# image creates that role and never sets a password on the built-in `postgres` superuser. A
# URL naming `postgres` fails with `password authentication failed for user "postgres"` —
# which reads as a wrong password and sends you to check the password, which is correct.
# (This line said `postgres` when the catalog was first deployed for real. It had never been
# run before that, so nothing contradicted it; documenting a command makes it look verified.)
#
# `api-token` is what the provider console's `CATALOG_API_TOKEN` must match — this service
# authenticates exactly one caller (device_mcp_catalog/app/config.py). It is wired
# `optional: true` on the Deployment, so the catalog starts without it and then rejects
# every request as unauthenticated; set it.
#
# `database-url` and `postgres-password` must agree — on the USER as well as the password.
# They are separate fields because Postgres reads one and the application reads the other;
# nothing checks that they agree, and a mismatch in either presents the same way: an
# application that starts cleanly and cannot authenticate to its own database. It does not
# crash — it logs `catalog database unavailable at startup, continuing degraded` and reports
# 503 on /readyz while /healthz stays 200, which is ADR-0020 §7's named-unavailable
# condition working as intended. Read /readyz, not the pod's Running status.

# ── After applying: point the provider console at it ───────────────────────────────
# The console reaches this across namespaces, so the Service DNS name needs the namespace:
#
#   CATALOG_SERVICE_URL: "http://device-mcp-catalog.mcp-provider.svc.cluster.local:8100"
#
# An in-namespace short name worked while the catalog lived in the gateway's namespace and
# will now silently resolve to nothing. Empty disables catalog features as a NAMED condition
# (ADR-0020 §7) — never inferred from an empty device-type list — so a console pointed at a
# stale address reports the catalog as unreachable rather than as curated-but-empty.
#
# networkpolicy.yaml admits the console's namespace by name; set it to wherever the provider
# console actually runs.
