# NetworkPolicy for the provider-plane catalog.
#
# Moved out of the gateway stack's networkpolicy.yaml, where these two rules used to sit as
# policies 8 and 9. They are unchanged in substance; what changed is that they now live with
# the component they select, so a tenant stack neither ships them nor has to delete them.
#
# ⚠️ Same caveat as the gateway stack's file: NetworkPolicy is purely additive-allow. These
# say what is *meant* to reach the catalog. Actually denying everything else needs a default
# -deny in this namespace — see the `default-deny` policy at the end of this file, which the
# gateway stack has an equivalent of and which this namespace previously inherited by
# accident, because it shared that namespace.

---
# ── 1. Default deny ────────────────────────────────────────────────────────────────
# Previously implicit: the catalog lived in the gateway's namespace and was covered by that
# namespace's own default-deny. Standing alone, it needs its own, or the two allow rules
# below would be decorative — every other pod in the cluster could still reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/name: device-mcp-catalog
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ── 2. Catalog service ─────────────────────────────────────────────────────────────
# The ONE cross-namespace path a device-mcp-catalog pod accepts, and it is deliberately
# narrow: the console BFF's namespace, and nothing else (ADR-0020 §7 — the BFF is exactly
# the caller the design gives it; the gateway and worker have no reason to reach the catalog
# at all, and none is granted here).
#
# ⚠️ Set the namespace name to wherever your **provider console** BFF runs. `mcp-gateway-ui`
# is the UI repo's own default namespace.
#
# ⚠️ **This paragraph used to say a tenant console has no business reaching the catalog
# directly. That was wrong about the code, and it is worth leaving the correction visible.**
# The tenant console's catalog routes read this service directly and always have — that second
# caller is what ADR-0020 §7a is about. What was true is that this policy never let them, which
# is the only reason a shared provider token spanning two trust domains was never reachable in
# a deployment: the credential gate was open and the network gate was shut. Two gates, one of
# them load-bearing by accident.
#
# So enabling the tenant claim path is a deliberate two-part change, and the order matters:
#
#   1. give that tenant its own credential (`tenant-tokens` in `catalog-secrets`, ADR-0020
#      §7a) — never the provider's, which the catalog now refuses to start with;
#   2. THEN add its namespace to the `from` list below.
#
# Doing 2 without 1 is exactly the configuration §7a exists to prevent. Nothing enforces the
# ordering, which is why it is written here, next to the change that would break it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-mcp-catalog
  labels:
    app.kubernetes.io/name: device-mcp-catalog
spec:
  podSelector:
    matchLabels:
      app: device-mcp-catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-gateway-ui
      ports:
        - port: 8100
          protocol: TCP

---
# ── 3. Monitoring scrape (ADR-0020 §7b) ────────────────────────────────────────────
# Without this the namespace default-deny silently drops every scrape, and the alert this
# service now exists to raise never fires — which is the worst possible failure for a
# should-never-happen alert: it is indistinguishable from the condition never occurring.
#
# ⚠️ Set the namespace to wherever YOUR Prometheus runs. `monitoring` is the
# kube-prometheus-stack default and is a guess about your cluster, exactly as it is in the
# gateway stack's own equivalent rule.
#
# Only :9100 is opened, never the API port. The exposition endpoint is unauthenticated by
# default (set CATALOG_METRICS_TOKEN to change that), so this rule is what keeps it from
# being readable by every namespace in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  labels:
    app.kubernetes.io/name: device-mcp-catalog
spec:
  podSelector:
    matchLabels:
      app: device-mcp-catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9100
          protocol: TCP

---
# ── 4. Catalog Postgres ────────────────────────────────────────────────────────────
# The store holding every device type and assignment record in the estate is reachable by
# the catalog service alone.
#
# Standing in its own namespace, this is now an enforcement change and not only a
# declaration. In the shared namespace it was neither: that namespace's blanket
# `allow-intra-namespace` rule already permitted any pod beside it to reach Postgres, so
# this policy documented an intent the topology did not hold to. There is no such blanket
# allow here, and policy 1 denies by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-postgres
  labels:
    app.kubernetes.io/name: catalog-postgres
spec:
  podSelector:
    matchLabels:
      app: catalog-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: device-mcp-catalog
      ports:
        - port: 5432
          protocol: TCP
