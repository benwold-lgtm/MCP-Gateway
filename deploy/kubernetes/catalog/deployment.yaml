apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-mcp-catalog
  labels:
    app.kubernetes.io/name: device-mcp-catalog
spec:
  # A single replica is fine to start: this service has no in-memory state of its own (every
  # read/write goes straight to Postgres), so it's horizontally scalable without coordination
  # whenever load justifies more than one — unlike the gateway's embedded mode, there is no
  # "distributed vs embedded" branch here to get right first.
  replicas: 1
  selector:
    matchLabels:
      app: device-mcp-catalog
  template:
    metadata:
      labels:
        app: device-mcp-catalog
    spec:
      containers:
        - name: catalog
          image: ghcr.io/benwold-lgtm/device-mcp-catalog:latest
          ports:
            - name: http
              containerPort: 8100
            # ADR-0020 §7b — Prometheus exposition, restricted by NetworkPolicy (F-36's
            # caveat applies here as it does to the gateway: unauthenticated unless
            # CATALOG_METRICS_TOKEN is set).
            - name: metrics
              containerPort: 9100
          env:
            - name: CATALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: database-url
            # The PROVIDER's credential: the privileged caller class (ADR-0020 §7a) —
            # curate, assign, read everything. The provider console's own
            # CATALOG_API_TOKEN must match this value; a tenant's must not.
            - name: CATALOG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: api-token
                  optional: true
            # The tenant caller class: a JSON map {tenant_id: token}, one entry per tenant
            # console that reads the catalog directly. Each token admits exactly that
            # tenant's assignments and claims — the tenant is read from the credential, never
            # from the request (ADR-0020 §7a).
            #
            # Optional, and empty is correct for a provider plane whose tenants do not read
            # the catalog. Malformed is NOT tolerated: a token shared with the provider, or
            # between two tenants, refuses startup rather than picking a winner — unlike the
            # database, where unavailability is a named condition the service stays up to
            # report. A credential table that resolves ambiguously does not fail to answer,
            # it answers as the wrong caller.
            - name: CATALOG_TENANT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: tenant-tokens
                  optional: true
            # ADR-0024 §11 — the Fernet key encrypting the provider's per-tenant
            # gateway credential. That one value must be PRESENTED on every support
            # request, not merely recognised, so it is encrypted rather than hashed and
            # the key has to live somewhere.
            #
            # `optional: true` matches every other key here, but the consequence is not
            # the same: an absent CATALOG_API_TOKEN closes a door, while an absent key
            # stores those credentials as PLAINTEXT in Postgres. The service warns at
            # startup and keeps running, deliberately, so a lab stays runnable without
            # key management — but a log line nobody reads is the whole risk, so treat
            # this as required for any deployment holding a real tenant credential.
            #
            #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
            - name: CATALOG_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: secret-key
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
