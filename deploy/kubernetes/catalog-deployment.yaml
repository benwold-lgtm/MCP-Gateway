apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-mcp-catalog
  labels:
    app.kubernetes.io/name: device-mcp-catalog
spec:
  # A single replica is fine to start: this service has no in-memory state of its own (every
  # read/write goes straight to Postgres), so it's horizontally scalable without coordination
  # whenever load justifies more than one — unlike the gateway's embedded mode, there is no
  # "distributed vs embedded" branch here to get right first.
  replicas: 1
  selector:
    matchLabels:
      app: device-mcp-catalog
  template:
    metadata:
      labels:
        app: device-mcp-catalog
    spec:
      containers:
        - name: catalog
          image: ghcr.io/benwold-lgtm/device-mcp-catalog:latest
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: CATALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: database-url
            # The one caller this service authenticates today (the console BFF's
            # CatalogClient) — see device_mcp_catalog/app/config.py.
            - name: CATALOG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: api-token
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
