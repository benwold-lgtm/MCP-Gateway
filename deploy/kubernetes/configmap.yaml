apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: device-mcp-gateway
data:
  config.yaml: |
    # Device MCP Gateway Configuration
    # Secrets (api_key, secret_key) are injected via the gateway-secrets Secret;
    # do not store them here.

    gateway:
      api_key: ""      # set via MCP_GATEWAY_API_KEY env var
      secret_key: ""   # set via MCP_SECRET_KEY env var
      # This bundle includes an Ingress, so requests reach the gateway via the ingress
      # controller and request.client.host is the controller pod — not the real client.
      # To key rate limits on the client, enable BOTH of these together (the gateway
      # refuses to start with trust on and no trusted_proxy_cidrs, because ingress-nginx
      # APPENDS to X-Forwarded-For and the left-most entry is whatever the client sent):
      # trust_proxy_headers: true

    server:
      host: "0.0.0.0"
      port: 8000

    registry:
      # "distributed" enables Redis-backed shared state, multiple gateway replicas,
      # and separate worker processes. "embedded" is for local dev only (no Redis).
      mode: "distributed"
      health_check_interval: 30
      spec_poll_interval: 300
      spec_cache_ttl: 3600
      max_concurrent_pods: 50

    redis:
      # URL is overridden by MCP_REDIS_URL env var injected in deployment.yaml.
      url: "redis://redis:6379/0"
      socket_timeout: 5
      max_connections: 20

    auth:
      type: "api_key"
      api_key:
        header_name: "X-API-Key"
      oauth2:
        token_endpoint: ""
        client_id: ""
        client_secret: ""
        scopes:
          - "read"
          - "write"

    transport:
      default: "sse"
      sse:
        keep_alive_interval: 15

    discovery:
      spec_paths:
        - "/openapi.json"
        - "/openapi.yaml"
        - "/swagger.json"
        - "/swagger.yaml"
        - "/api-docs"
        - "/docs/openapi.json"
        - "/openapi/3.0.json"
        - "/api/v1/openapi.json"
      timeout: 10

    storage:
      type: "sqlite"
      db_path: "/app/data/devices.db"

    cors:
      # Set specific origins for production browser clients; empty disables CORS.
      allowed_origins: []

    # security:
    #   # Companion to gateway.trust_proxy_headers above. List the ranges the ingress
    #   # controller actually connects from — your cluster pod CIDR, plus the service/LB
    #   # range if traffic traverses one. These are cluster-specific; read them off your
    #   # cluster rather than copying (kubectl get pod -n ingress-nginx -o wide, or the
    #   # --cluster-cidr / --service-cluster-ip-range flags on the control plane).
    #   # Only list infrastructure you control: each range is a hop an attacker no longer
    #   # has to get past, and 0.0.0.0/0 would restore the spoofing bypass outright.
    #   trusted_proxy_cidrs:
    #     - "10.244.0.0/16"   # pod CIDR (kubeadm/flannel default — verify yours)
    #     - "10.96.0.0/12"    # service CIDR (kubeadm default — verify yours)

    logging:
      level: "INFO"
      file: "logs/gateway.log"
      max_size: 50
      backup_count: 5
