---
# Gateway NetworkPolicy — restricts ingress and egress for gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-mcp-gateway
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: device-mcp-gateway
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - ports:
        - port: 8000
          protocol: TCP
    # Prometheus scrape of the dedicated metrics port. Scope this with a
    # namespaceSelector for your monitoring namespace in production rather than
    # leaving it open to the whole cluster.
    - ports:
        - port: 9100
          protocol: TCP

  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Redis (shared state)
    - ports:
        - port: 6379
          protocol: TCP
    # Downstream device APIs.
    #
    # ⚠️ THIS IS AN ALLOWLIST YOU ARE EXPECTED TO EXTEND. It covers the common HTTP
    # ports only. A device on any other port — a BMC on 623, Prism on 9440, a vendor
    # appliance on 8006 — is simply unreachable until you add it here, and the symptom
    # is a connection timeout at health-check time rather than anything naming this
    # policy. Add a port to BOTH this policy and the worker one below: in distributed
    # mode the worker does the fetching, so the gateway's copy alone is not enough.
    #
    # The gateway's own egress guard (security.allowed_target_ports) is a separate,
    # narrower control — satisfying one does not satisfy the other.
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP

---
# Worker NetworkPolicy — workers need Redis + downstream device API access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-mcp-worker
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: device-mcp-worker
  policyTypes:
    - Ingress
    - Egress

  # Workers accept no API traffic — only Prometheus scraping of the metrics port.
  # Scope this with a namespaceSelector for your monitoring namespace in production.
  ingress:
    - ports:
        - port: 9100
          protocol: TCP

  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Redis (shared state + tool call streams)
    - ports:
        - port: 6379
          protocol: TCP
    # Downstream device APIs. Same allowlist as the gateway policy above, and the same
    # caveat: extend it for any device on a port not listed here. In distributed mode
    # THIS is the policy that governs whether a device is reachable at all, because the
    # worker performs the spec fetch, the health check and every tool call.
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP

---
# Redis NetworkPolicy — Redis only accepts connections from gateway/worker pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: device-mcp-gateway
        - podSelector:
            matchLabels:
              app: device-mcp-worker
      ports:
        - port: 6379
          protocol: TCP
